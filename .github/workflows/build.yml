name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - name: Build (retries, and switches the mixin download server between tries)
        run: |
          for attempt in 1 2 3 4; do
            extra=""
            if [ $((attempt % 2)) -eq 1 ]; then
              extra="-PspongeMixin=true"
            fi
            echo "Attempt $attempt of 4 $extra"
            if gradle build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 $extra; then
              exit 0
            fi
            echo "Build failed. Waiting 60 seconds before trying again..."
            sleep 60
          done
          exit 1
      - name: Run tests
        run: gradle test --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - name: Build ProGuard-protected jar (FalconGuard Layer 1)
        run: gradle buildProtected --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-protected
          path: build/libs/*-protected.jar
