name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - run: gradle build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
